name: Molar
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  bundleIdPrefix: com.fabien
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Molar:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Molar
        excludes:
          - "Preview Content/**"
      - path: Molar/Preview Content
        buildPhase:
          copyFiles:
            destination: resources
        attributes: [development_assets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabien.molar
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Molar
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIStatusBarStyle: "UIStatusBarStyleDefault"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"Molar/Preview Content\""
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 47FJ3R4TQJ
